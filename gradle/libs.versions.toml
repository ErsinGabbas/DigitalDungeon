[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
testRunner = "1.7.0"
# androidx.test 1.7 calls Trace.forceEnableAppTracing(), added in tracing 1.1.
# Compose only asks for 1.0, and the app APK's copy is the one that loads.
tracing = "1.2.0"
appcompat = "1.7.0"
material = "1.12.0"
activityCompose = "1.9.3"
# Compose BOM 2024.11.00 pins ui 1.7.5 / material3 1.3.1 — the versions this
# project used to hardcode, so artifacts below must not carry their own version.
composeBom = "2024.11.00"
lifecycle = "2.8.7"
# 2.8.9 is the last stable 2.8.x: built for Compose 1.7.x (the BOM above pins 1.7.5)
# and still published against compileSdk 35 — 2.9.x already requires compileSdk 36.
navigationCompose = "2.8.9"
room = "2.6.1"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
kotlinxSerializationJson = "1.8.0"
# Matches the coroutines version already on the runtime classpath (room-ktx 2.6.1 asks for
# 1.7.1, lifecycle 2.8.7 for 1.7.3, so Gradle resolves 1.7.3). Keep these in sync: a newer
# coroutines-test would drag coroutines-core up for the whole project.
kotlinxCoroutinesTest = "1.7.3"
# 4.14.1 is the first release with an android-all jar for SDK 35, which is this project's
# compileSdk. Robolectric runs the DAO, backup and migration-adjacent tests on the JVM, so
# they need no device; androidTest keeps only what genuinely needs one.
robolectric = "4.14.1"
# Provides ApplicationProvider, which is how a Robolectric test gets the Context that
# Room.inMemoryDatabaseBuilder asks for. The matching androidx.test.ext:junit is already here.
androidxTestCore = "1.6.1"
ksp = "2.0.21-1.0.28"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# Provides the AndroidJUnitRunner named in defaultConfig.testInstrumentationRunner
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-tracing = { group = "androidx.tracing", name = "tracing", version.ref = "tracing" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# Compose UI testing - versions come from the BOM like every other compose artifact
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# @Preview annotation — needed whenever the composables are compiled, release included
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# The preview renderer itself — debug only, it must not ship in the release APK
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Already on the classpath transitively; declared explicitly so collectAsStateWithLifecycle
# does not depend on another library happening to pull it in.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Unit tests only: runTest, TestDispatcher, advanceUntilIdle
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }

# Unit tests only: runs the Android framework on the JVM, so Room's real SQLite can be
# exercised without a device.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
