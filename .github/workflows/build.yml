name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the previous run pointless; let it go rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The project compiles against Java 17 (see app/build.gradle.kts compileOptions).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      # There is no keystore on CI, so this APK comes out unsigned - which is fine and
      # is handled by the build: signingConfigs only creates the release config when
      # local.properties points at a keystore. The reason to build it anyway is R8:
      # the keep rules for kotlinx.serialization and the Room-stored enum are only
      # exercised by a minified build, and a debug build would never catch them rotting.
      - name: Release build (unsigned)
        run: ./gradlew :app:assembleRelease

      # Instrumented tests are deliberately not run here: they need an emulator, which
      # is slow and flaky on CI runners. They are run locally against a device.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
